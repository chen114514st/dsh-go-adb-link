name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只跑测试与打包，不创建 Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          echo "package.json=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::标签与 package.json 版本不一致"; exit 1; }

      - name: 测试与视图检查
        run: npm test && npm run check

      - name: 打包
        run: |
          npm pack
          ver=$(node -p "require('./package.json').version")
          # 先写到临时目录，避免 tar 读到正在写入的归档自身
          tar czf "$RUNNER_TEMP/dsh-go-adb-link-$ver-src.tar.gz" \
            --exclude='*.tgz' --exclude='*.tar.gz' --exclude=node_modules --exclude=.git -C . .
          mv "$RUNNER_TEMP/dsh-go-adb-link-$ver-src.tar.gz" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-adb-link
          path: |
            *.tgz
            dsh-go-adb-link-*-src.tar.gz

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            dsh-go-adb-link-*-src.tar.gz
          generate_release_notes: true
